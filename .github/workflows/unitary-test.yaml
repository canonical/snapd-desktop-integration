name: tests
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unitary-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup build environment
        uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
      - name: Install dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y meson ninja-build jq libgtk-4-dev libnotify-dev libsoup-3.0-dev libjson-glib-dev libpolkit-gobject-1-dev weston gcovr librsvg2-2 xwayland-run gettext
      - name: Build snapd-glib
        run: |
          git clone https://github.com/snapcore/snapd-glib.git
          cd snapd-glib
          meson setup _build --prefix=/usr -Ddocs=false -Dintrospection=false -Dvala-bindings=false -Dqt5=false -Dqt6=false -Dqml-bindings=false -Dtests=false -Dexamples=false
          ninja -C _build
          sudo ninja -C _build install
          cd ..
      - name: Build libnotify
        run: |
          git clone https://gitlab.gnome.org/GNOME/libnotify.git
          cd libnotify
          git checkout 0.8.8
          meson setup _build --prefix=/usr \
            -Dgtk_doc=false \
            -Dman=false \
            -Dintrospection=disabled \
            -Dtests=false
          ninja -C _build
          sudo ninja -C _build install
          cd ..
      - name: Build
        run: |
          meson setup _build
          ninja -C _build
      - name: Test
        run: |
          # can't use XVFB because gtk_settings uses Xsettings by default, but we need to use keyfile backend
          wlheadless-run -c weston -- meson test -v -C _build --print-errorlogs -t 3
      - name: Coverage
        run: |
          mkdir -p coverage
          gcovr _build --cobertura coverage/cobertura.xml